services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - ebook-network

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ebook-network

  api:
    build:
      context: .
      dockerfile: eBook.API/Dockerfile
    env_file:
      - .env
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
      - rabbitmq
    networks:
      - ebook-network

volumes:
  sqldata:

networks:
  ebook-network:
    driver: bridge
